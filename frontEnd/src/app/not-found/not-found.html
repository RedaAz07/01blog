<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="not-found.scss"/><!-- swap for .css if not using Angular -->
</head>
<body>
  <div class="nf-page">
    <div class="nf-card">

      <!-- top accent handled by ::before in CSS -->

      <!-- ── 404 glyph ── -->
      <div class="nf-glyph" aria-label="404">
        <span class="nf-4a">4</span>
        <span class="nf-0">0</span>
        <span class="nf-4b">4</span>
      </div>

      <!-- ── dot decoration ── -->
      <div class="nf-dot-grid" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <!-- ── label ── -->
      <div class="nf-tag">Page not found</div>

      <!-- ── headline ── -->
      <h1 class="nf-title">Lost in the woods</h1>

      <!-- ── description ── -->
      <p class="nf-desc">
        The page you're looking for doesn't exist or has been moved.
        Double-check the URL or head back home.
      </p>

      <!-- ── fake path ── -->
      <div class="nf-path-row" aria-hidden="true">
        <span>~</span>
        <span class="nf-sep">/</span>
        <span>this</span>
        <span class="nf-sep">/</span>
        <span>page</span>
        <span class="nf-sep">/</span>
        <span class="nf-path-current">not-found</span>
      </div>

      <!-- ── CTA ── -->
      <a class="nf-btn" href="/">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Go back home
      </a>

      <p class="nf-back-hint">
        Or <a href="javascript:history.back()">go back</a> to the previous page
      </p>

      <div class="nf-divider"></div>

      <!-- ── footer links ── -->
      <div class="nf-footer-links">
        <a href="/contact" class="nf-footer-link">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          Contact support
        </a>
        <span class="nf-footer-sep">·</span>
        <a href="/sitemap" class="nf-footer-link">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 9h18M9 21V9"/>
          </svg>
          Sitemap
        </a>
      </div>

    </div>
  </div>
</body>
</html>
