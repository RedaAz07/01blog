<div class="login-container">
  <h2>Welcome Back</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div>
      <label>Username</label>
      <input type="text" formControlName="username" placeholder="Enter username">
      
      <span style="color: red;" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
        Username is required!
      </span>
    </div>

    <div>
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="Enter password">
      
      <span style="color: red;" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        Password must be at least 4 characters!
      </span>
    </div>

    <div *ngIf="errorMessage" style="color: red; margin-top: 10px;">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loginForm.invalid">
      Login
    </button>

  </form>
</div>
