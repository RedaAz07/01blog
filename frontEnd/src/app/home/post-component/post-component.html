<div class="modal-overlay" [class.active]="isOpen" (click)="closeModal()"></div>

<div class="post-modal" [class.open]="isOpen">

  <!-- ── Header ── -->
  <div class="modal-header">
    <h3>{{ editingPost ? 'Edit Post' : 'Create Post' }}</h3>
    <button class="modal-close" (click)="closeModal()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- ── Body ── -->
  <div class="modal-body">

    <!-- User row -->
    <div class="modal-user" *ngIf="authService.currentUser$ | async as cUser">
      <div class="modal-avatar-circle">{{ cUser.username.charAt(0) | uppercase }}</div>
      <div>
        <span class="modal-username">{{ cUser.username }}</span>
        <span class="modal-user-sub">Publishing to your profile</span>
      </div>
    </div>

    <div class="modal-divider"></div>

    <!-- Title -->
    <input
      type="text"
      class="modal-input"
      placeholder="Post title *"
      [(ngModel)]="postTitle"  >

    <!-- Editor.js -->
    <span class="editor-label">Content</span>
    <div class="editor-container">
      <div id="editorjs"></div>
    </div>

    <div class="modal-divider"></div>

    <!-- Actions -->
    <div class="modal-actions-bar">
      <button class="cancel-btn" (click)="closeModal()">Cancel</button>
      <button
        class="submit-post-btn"
        [disabled]="!postTitle"
        (click)="submitPost()">
        <mat-icon>{{ editingPost ? 'edit' : 'send' }}</mat-icon>
        {{ editingPost ? 'Update' : 'Publish' }}
      </button>
    </div>

  </div>
</div>
