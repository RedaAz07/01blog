<div class="modal-overlay" [class.active]="isOpen" (click)="closeModal()"></div>

<div class="post-modal" [class.open]="isOpen">
  <div class="modal-header">
    <h3>{{ editingPost ? 'Edit Post' : 'Create Post' }}</h3>
    <button class="modal-close" (click)="closeModal()" [disabled]="isSubmitting"><mat-icon>close</mat-icon></button>
  </div>

  <div class="modal-body">
    <div class="modal-user" *ngIf="authService.currentUser$ | async as cUser">
      <div class="modal-avatar-circle">{{ cUser.username | slice: 0 : 1 | uppercase }}</div>
      <div>
        <span class="modal-username">{{ cUser.username }}</span>
        <span class="modal-user-sub">Publishing to your profile</span>
      </div>
    </div>

    <div class="modal-divider"></div>

    <input type="text" class="modal-input" placeholder="Post title *" [(ngModel)]="postTitle" [disabled]="isSubmitting" />

    <span class="editor-label">Content</span>
    <textarea
      class="modal-input"
      rows="4"
      placeholder="What's on your mind, bro?"
      [(ngModel)]="postContent"
      [disabled]="isSubmitting"
    ></textarea>

    <span class="editor-label">Media (Max 5 files)</span>
    <input
      type="file"
      multiple
      accept="image/*,video/*"
      (change)="onFilesSelected($event)"
      [disabled]="isSubmitting || selectedFiles.length + existingImageUrls.length >= 5"
    />

    <div class="file-preview-list" *ngIf="selectedFiles.length > 0 || existingImageUrls.length > 0">
      <div class="file-badge" *ngFor="let url of existingImageUrls; let i = index">
        <img *ngIf="!isVideo(url)" [src]="url" class="preview-image" />
        <mat-icon *ngIf="isVideo(url)">videocam</mat-icon>

        <button class="remove-file-btn" (click)="removeExistingFile(i)" [disabled]="isSubmitting">
          <mat-icon>cancel</mat-icon>
        </button>
      </div>

      <div class="file-badge" *ngFor="let item of selectedFiles; let i = index">
        <img
          *ngIf="item.file.type.startsWith('image/')"
          [src]="item.previewUrl"
          class="preview-image"
        />
        <mat-icon *ngIf="!item.file.type.startsWith('image/')"> insert_drive_file </mat-icon>

        <button class="remove-file-btn" (click)="removeNewFile(i)" [disabled]="isSubmitting">
          <mat-icon>cancel</mat-icon>
        </button>
      </div>
    </div>

    <div class="modal-divider"></div>

  <div class="modal-actions-bar">
      <button class="cancel-btn" (click)="closeModal()" [disabled]="isSubmitting">Cancel</button>
      
      <button 
        class="submit-post-btn" 
        [disabled]="!postTitle || !postContent || isSubmitting" 
        (click)="submitPost()">
        
        <mat-icon *ngIf="!isSubmitting">{{ editingPost ? 'edit' : 'send' }}</mat-icon>
        
        <mat-icon *ngIf="isSubmitting" class="spinner-icon">sync</mat-icon>
        
        {{ isSubmitting ? 'Saving...' : (editingPost ? 'Update' : 'Publish') }}
      </button>
    </div>
  </div>
</div>
