<header class="navbar" *ngIf="authService.currentUser$ | async as user">
  <div class="nav-left">
    <span class="brand">01<span class="brand-accent">blog</span></span>
  </div>

  <div class="nav-center">
    <div class="search-wrap">
      <mat-icon class="search-ico">search</mat-icon>
      <input type="text" class="search-input" placeholder="Search posts, topics, people…"
        [(ngModel)]="searchQuery" (input)="onSearch()">
    </div>
  </div>

  <div class="nav-right">
    <!-- Dashboard — admin only -->
    <a *ngIf="user?.role === 'ROLE_ADMIN'" class="nav-link dashboard-link" href="#">
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </a>

    <!-- Notifications -->
    <div class="notif-wrapper" #notifRef>
      <button class="notif-btn" (click)="toggleNotifications()">
        <mat-icon>notifications</mat-icon>
        <span class="notif-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </button>

      <!-- Notification Popup -->
      <div class="notif-popup" [class.open]="notifOpen">
        <div class="notif-popup-header">
          <span class="notif-popup-title">Notifications</span>
          <button class="notif-clear-btn" (click)="clearAll()" [disabled]="notifications.length === 0">
            <mat-icon>delete_sweep</mat-icon> Clear all
          </button>
        </div>

        <div class="notif-list" *ngIf="notifications.length > 0; else emptyNotif">
          <div class="notif-item" *ngFor="let n of notifications" [class.unread]="!n.read" (click)="markRead(n)">
            <div class="notif-icon-wrap" [ngClass]="n.type">
              <mat-icon>{{ n.icon }}</mat-icon>
            </div>
            <div class="notif-content">
              <p class="notif-text">{{ n.text }}</p>
              <span class="notif-time">{{ n.time }}</span>
            </div>
            <span class="notif-dot" *ngIf="!n.read"></span>
          </div>
        </div>

        <ng-template #emptyNotif>
          <div class="notif-empty">
            <mat-icon>notifications_none</mat-icon>
            <p>You're all caught up!</p>
          </div>
        </ng-template>

        <div class="notif-popup-footer">
          <button class="notif-load-btn" (click)="loadMore()" [disabled]="loadingMore">
            <mat-icon>expand_more</mat-icon>
            {{ loadingMore ? 'Loading…' : 'Load 5 more' }}
          </button>
        </div>
      </div>
    </div>

    <!-- Profile avatar + sidebar trigger -->
    <button class="avatar-btn" (click)="toggleProfileSidebar()">
      <span class="cover">
        <p class="nav-avatar">{{ user.username.charAt(0) }}</p>
      </span>
      <span class="avatar-name">{{ user.username }}</span>
    </button>
  </div>
</header>

<!-- Overlay to close notification popup -->
<div class="notif-overlay" *ngIf="notifOpen" (click)="closeNotifications()"></div>
