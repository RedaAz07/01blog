<header class="navbar" *ngIf="authService.currentUser$ | async as user">
  <div class="nav-left">
    <a class="homeRoute" [routerLink]="['home']"
      ><span class="brand">01<span class="brand-accent">blog</span></span></a
    >
  </div>

  <div class="nav-center">
    <div class="search-wrap">
      <mat-icon class="search-ico">search</mat-icon>
      <input
        type="text"
        class="search-input"
        placeholder="Search people…"
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
      />
    </div>
  </div>

  <!-- Search Results Dropdown -->
    <div class="nav-center search-results" *ngIf="searchResults$ | async as results">
      <div class="search-result-item" *ngIf="results.users.length === 0">
        <p>No Search Results Found for "{{ searchQuery }}"</p>
      </div>
      <div class="search-result-item" *ngFor="let user of results.users">
        <a [routerLink]="['/profile', user.username]" (click)="closeSearch()">
          <div class="pp-circle1">{{ user.username.charAt(0) | uppercase }}</div>

          {{ user.username }}</a
        >
      </div>
    </div>

  <div class="nav-right">
    <!-- Dashboard — admin only -->
    <a
      *ngIf="user?.role === 'ROLE_ADMIN'"
      class="nav-link dashboard-link"
      [routerLink]="['/dashboard']"
    >
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </a>

    <button
      class="theme-btn"
      type="button"
      (click)="toggleTheme()"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.title]="themeService.isDark() ? 'Light mode' : 'Dark mode'"
    >
      <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      <span>{{ themeService.isDark() ? 'Light' : 'Dark' }}</span>
    </button>

    <!-- Notifications Bell -->
    <div>
      <button class="notif-btn" (click)="toggleNotifications()">
        <mat-icon>notifications</mat-icon>
        <span class="notif-count" *ngIf="currentUser()?.notifications">
          {{ currentUser()?.notifications || 0 }}
        </span>
      </button>
    </div>

    <!-- Notification Popup -->
    <div class="notif-popup" [class.open]="notifOpen">
      <ng-container *ngIf="notificationService.notifications$ | async as notifs">
        <div class="notif-popup-header">
          <span class="notif-popup-title">Notifications</span>
          <button class="notif-clear-btn" (click)="clearAll()" [disabled]="notifs.length === 0">
            <mat-icon>delete_sweep</mat-icon> Clear all
          </button>
        </div>

        <div class="notif-list" *ngIf="notifs.length > 0; else emptyNotif">
          <div
            class="notif-item"
            *ngFor="let n of notifs"
            [class.unread]="!n.isRead"
            (click)="markRead(n)"
          >
            <div class="notif-icon-wrap">
              <mat-icon>article</mat-icon>
            </div>
            <a class="href" [routerLink]="['/profile/', n.senderUsername]"
              ><div class="notif-content">
                <p class="notif-text">{{ n.senderUsername }} posted a new article</p>
                <span class="notif-time">{{ n.timestamp }}</span>
              </div></a
            >
            <span class="notif-dot" *ngIf="!n.isRead"></span>
          </div>
        </div>

        <ng-template #emptyNotif>
          <div class="notif-empty">
            <mat-icon>notifications_none</mat-icon>
            <p>You're all caught up!</p>
          </div>
        </ng-template>
      </ng-container>

      <div class="notif-popup-footer">
        <button class="notif-load-btn" (click)="loadMore()" [disabled]="isLoading || isLastPage">
          <mat-icon>expand_more</mat-icon>
          {{ isLoading ? 'Loading…' : 'Load 5 more' }}
        </button>
      </div>
    </div>

    <!-- Profile Avatar Button + Hover Popup -->
    <button class="avatar-btn" (click)="toggleProfileSidebar()">
      <span class="cover">
        <p class="nav-avatar">{{ user.username.charAt(0) | uppercase }}</p>
      </span>
      <span class="avatar-name">{{ user.username }}</span>

      <!-- Profile mini-popup (shows on hover) -->
      <div class="profile-popup" (click)="$event.stopPropagation()">
        <div class="pp-circle">{{ user.username.charAt(0) | uppercase }}</div>
        <span class="pp-name">{{ user.firstName }} {{ user.lastName }}</span>
        <span class="pp-username">@{{ user.username | titlecase }}</span>

        <div class="ps-stats" *ngIf="authService.currentUser$ | async as currentUser">
          <div class="ps-stat">
            <span class="ps-stat-val">{{ currentUser.posts }}</span>
            <span class="ps-stat-lbl">Posts</span>
          </div>
          <div class="ps-stat">
            <span class="ps-stat-val">{{ currentUser.followers }}</span>
            <span class="ps-stat-lbl">Followers</span>
          </div>
          <div class="ps-stat">
            <span class="ps-stat-val">{{ currentUser.following }}</span>
            <span class="ps-stat-lbl">Following</span>
          </div>
        </div>
        <a class="pp-btn" [routerLink]="['/profile/', user.username]">
          <mat-icon>person</mat-icon> View Profile
        </a>
        <button class="pp-btn" (click)="logout()"><mat-icon>logout</mat-icon> Logout</button>
      </div>
    </button>
  </div>
</header>

<!-- Overlay to close notification popup -->
 <div class="notif-overlay" *ngIf="notifOpen" (click)="closeNotifications()"></div>
