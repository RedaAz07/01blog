<header class="navbar" *ngIf="authService.currentUser$ | async as user">
  <div class="nav-left">
    <span class="brand">01<span class="brand-accent">blog</span></span>
  </div>

  <div class="nav-center">
    <div class="search-wrap">
      <mat-icon class="search-ico">search</mat-icon>
      <input type="text" class="search-input" placeholder="Search posts, topics, people…"
        [(ngModel)]="searchQuery" (input)="onSearch()">
    </div>
  </div>

  <div class="nav-right">
    <!-- Dashboard — admin only -->
    <a *ngIf="user?.role === 'ROLE_ADMIN'" class="nav-link dashboard-link" href="#">
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </a>
    <div>
      <button class="notif-btn" (click)="toggleNotifications()">
        <mat-icon>notifications</mat-icon>
        <span class="notif-count" *ngIf="notificationService.notifications$ | async as notifs">
          {{ notifs.length }}
        </span>
      </button>
    </div>

    <!-- Notifications -->
     
   <div class="notif-popup" [class.open]="notifOpen">
        <ng-container *ngIf="notificationService.notifications$ | async as notifs">
          
          <div class="notif-popup-header">
            <span class="notif-popup-title">Notifications</span>
            <button class="notif-clear-btn" (click)="clearAll()" [disabled]="notifs.length === 0">
              <mat-icon>delete_sweep</mat-icon> Clear all
            </button>
          </div>

          <div class="notif-list" *ngIf="notifs.length > 0; else emptyNotif">
            <div class="notif-item" *ngFor="let n of notifs" [class.unread]="!n.isRead" (click)="markRead(n)">
              
              <div class="notif-icon-wrap" >
                <mat-icon>article</mat-icon>
              </div>
              
              <div class="notif-content">
                <p class="notif-text">{{ n.senderUsername }} posted a new article  </p> <span class="notif-time">{{ n.timestamp }}</span>
              </div>
              <span class="notif-dot" *ngIf="!n.isRead"></span>
            </div>
          </div>

          <ng-template #emptyNotif>
            <div class="notif-empty">
              <mat-icon>notifications_none</mat-icon>
              <p>You're all caught up!</p>
            </div>
          </ng-template>

        </ng-container> <div class="notif-popup-footer">
          <button class="notif-load-btn" (click)="loadMore()" [disabled]="isLoading || isLastPage">
            <mat-icon>expand_more</mat-icon>
            {{ isLoading ? 'Loading…' : 'Load 5 more' }}
          </button>
        </div>
      </div>
    </div>

    <!-- Profile avatar + sidebar trigger -->
    <button class="avatar-btn" (click)="toggleProfileSidebar()">
      <span class="cover">
        <p class="nav-avatar">{{ user.username.charAt(0)  | uppercase }}</p>
      </span>
      <span class="avatar-name">{{ user.username }}</span>
    </button>
</header>
